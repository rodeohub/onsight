# Publishes the Onsight site to GitHub Pages: everything the site served before (index.html, dist/preview.html, ...)
# plus Storybook at /storybook/. Runs on every merge to main, or by hand from the Actions tab.
# Needs Settings, Pages, Source: "GitHub Actions" (set once; the old source was "Deploy from a branch").
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build Storybook
        run: npx storybook build --output-dir storybook-static
      - name: Assemble the site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./node_modules --exclude=./_site --exclude=./storybook-static -cf - . | tar -xf - -C _site
          mv storybook-static _site/storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
